name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    # ubuntu-latest ships Docker by default, which the Testcontainers-based tests
    # in ledger-core and isolation-lab need -- no extra setup required.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # settlement-worker and balance-read-model additionally need a JDK 21 toolchain
      # (see docs/04-architecture.md); the Gradle toolchain resolver picks this up
      # automatically once it's installed and discoverable.
      - name: Set up JDK 21 (secondary toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain
