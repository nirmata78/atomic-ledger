[versions]
junit = "5.11.4"
assertj = "3.26.3"
awaitility = "4.2.2"
postgresql = "42.7.4"
hikaricp = "5.1.0"
testcontainers = "1.20.4"
spock = "2.4-M4-groovy-4.0"
groovy = "4.0.24"
springBoot = "3.4.1"
springDependencyManagement = "1.1.7"
slf4j = "2.0.16"
logback = "1.5.15"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
postgresql-driver = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

spock-core = { module = "org.spockframework:spock-core", version.ref = "spock" }
groovy = { module = "org.apache.groovy:groovy", version.ref = "groovy" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[bundles]
testing-core = ["junit-jupiter", "assertj-core", "awaitility"]
testcontainers-pg = ["testcontainers-core", "testcontainers-postgresql", "testcontainers-junit"]

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
