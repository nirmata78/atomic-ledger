# GitHub Pages / Jekyll configuration.
#
# Design constraint, copied from a working sibling project (rednavis/distributed-lock-lab):
# the Markdown files here are read primarily on github.com, so none of them carry YAML front
# matter -- GitHub renders front matter as an ugly table at the top of the page. Everything
# Jekyll needs (layout, title, nav order) is injected from `defaults` below instead, keyed on
# exact file paths. Adding a doc page means adding a `defaults` entry here, not editing the page.
#
# Built and deployed by .github/workflows/pages.yml.

title: atomic-ledger
description: >-
  A small banking-ledger service built to close three interview-exposed gaps: java.util.concurrent
  recall, ReentrantLock used correctly, and PostgreSQL transaction-isolation behaviour.
url: https://AlexOreshkevich.github.io
baseurl: /atomic-ledger

remote_theme: just-the-docs/just-the-docs@v0.10.1

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

optional_front_matter:
  remove_originals: true

titles_from_headings:
  enabled: true
  strip_title: false

search_enabled: true
search:
  heading_level: 3
  previews: 2
  tokenizer_separator: /[\s/]+/

heading_anchors: true
color_scheme: dark

aux_links:
  "View on GitHub":
    - "https://github.com/AlexOreshkevich/atomic-ledger"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  MIT licensed. A practice project built ahead of an interview loop -- not a production system.

exclude:
  - .github/
  - LICENSE
  - .gitignore
  - docker-compose.yml
  - build/
  - .gradle/
  - "**/build/"
  - gradle/
  - gradlew
  - gradlew.bat

defaults:
  - scope: { path: "" }
    values:
      layout: default

  - scope: { path: "README.md" }
    values: { title: "Home", nav_order: 1, permalink: "/" }

  - scope: { path: "tasks/README.md" }
    values: { title: "Task board", nav_order: 2 }
  - scope: { path: "tasks" }
    values: { nav_exclude: true, parent: "Task board" }

  - scope: { path: "docs/README.md" }
    values: { title: "Documentation", nav_order: 3, has_children: true }
  - scope: { path: "docs/00-overview.md" }
    values: { title: "00 Overview", parent: "Documentation", nav_order: 0 }
  - scope: { path: "docs/01-domain-model.md" }
    values: { title: "01 Domain model", parent: "Documentation", nav_order: 1 }
  - scope: { path: "docs/02-concurrency-theory.md" }
    values: { title: "02 Concurrency theory", parent: "Documentation", nav_order: 2 }
  - scope: { path: "docs/03-isolation-levels-theory.md" }
    values: { title: "03 Isolation levels", parent: "Documentation", nav_order: 3 }
  - scope: { path: "docs/04-architecture.md" }
    values: { title: "04 Architecture", parent: "Documentation", nav_order: 4 }
